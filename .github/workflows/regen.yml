name: regen

on:
  # Daily. Slot derived from a hash of the repo name, like pipeline.yml, but a
  # different slice of it so the two never share a minute:
  #   c=$(printf go-mistral | cksum | cut -d' ' -f1)
  #   minute=$(( (c / 1440) % 60 ))   -> 1
  #   hour=$(( (c / 86400) % 24 ))    -> 19
  schedule:
    - cron: "1 19 * * *"
  workflow_dispatch:

jobs:
  regen:
    permissions:
      contents: write # commit, tag and GitHub release
      issues: write # failure issue on scheduled runs
    uses: psyb0t/reusable-github-workflows/.github/workflows/regen-and-update-repo.yml@master
    with:
      generate_command: "make generate"
      check_commands: "make lint && make test && make sec"
      changelog_path: "CHANGELOG.md"
      version_files: ".agents/.codex-plugin/plugin.json"
      # Hand the version line of each spec under api/ to the description step.
      context_command: "for f in api/*; do if [ -f \"$f\" ]; then printf '%s: %s\\n' \"$f\" \"$(grep -m1 -E '^ *\\\"?version\\\"? *:' \"$f\" || echo unknown)\"; fi; done"
      go_apidiff: true
      go_module: "github.com/psyb0t/go-mistral"
      clawhub_publish: true
      clawhub_skill_names: '["go-mistral"]'
      clawhub_plugin_names: "[]"
      failure_issue_title: "Scheduled spec regeneration failed"
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
